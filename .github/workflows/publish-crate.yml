name: Publish Crate

# Tag push `v*`: runs real `cargo publish` (publish job only; verify is skipped because event is `push`).
# workflow_dispatch: dry-run by default; set `publish_to_crates_io` to true to run real publish from the selected ref.
# pull_request: dry-run only.
on:
  workflow_dispatch:
    inputs:
      publish_to_crates_io:
        description: "If true, run cargo publish (requires CARGO_REGISTRY_TOKEN). If false, dry-run only."
        type: boolean
        default: false
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-publish:
    name: Verify publish (dry-run)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo package check (workspace)
        run: |
          for pkg in noxssh-core noxssh-client noxssh-server noxssh-shell noxssh noxssh-cli noxsshd; do
            cargo package -p "$pkg"
          done

      - name: Cargo publish dry-run (workspace)
        run: |
          for pkg in noxssh-core noxssh-client noxssh-server noxssh-shell noxssh noxssh-cli noxsshd; do
            cargo publish -p "$pkg" --locked --dry-run
          done

  publish:
    name: Publish to crates.io
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_crates_io == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in noxssh-core noxssh-client noxssh-server noxssh-shell noxssh noxssh-cli noxsshd; do
            cargo publish -p "$pkg" --locked
            sleep 30
          done
